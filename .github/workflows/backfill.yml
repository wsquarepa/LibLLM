name: Backfill Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-tag to build (e.g. v2.4.0)'
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG does not match required format vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag exists
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Tag $TAG does not exist in this repository"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: backfill-${{ matrix.target }}-${{ inputs.tag }}

      - name: Set channel
        shell: bash
        run: echo "LIBLLM_CHANNEL=stable" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Rename binaries
        shell: bash
        run: |
          for pair in "client:libllm"; do
            cargo_name="${pair%%:*}"
            release_name="${pair##*:}"
            src="target/${{ matrix.target }}/release/${cargo_name}"
            if [[ -f "${src}.exe" ]]; then
              mv "${src}.exe" "${release_name}-${{ matrix.target }}.exe"
            elif [[ -f "${src}" ]]; then
              mv "${src}" "${release_name}-${{ matrix.target }}"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            libllm-${{ matrix.target }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes
        shell: bash
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          TAG="${{ inputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            echo "Backfilled release."
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              git log --format="- [%h](${REPO_URL}/commit/%H) %s" "${PREV_TAG}..${TAG}"
            else
              git log -1 --format="- [%h](${REPO_URL}/commit/%H) %s" "${TAG}"
            fi
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          SHA=$(git rev-parse "${TAG}^{commit}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" artifacts/* \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest=false
